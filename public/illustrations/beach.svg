<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <!-- TriptAi beach: brand palette sunset (brand #4f2cff, orchid #a855ff, coral #ff6b8a,
       mango #ffb347), aqua/azure sea, cream sand, deep-indigo palms -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f2cff"/>
      <stop offset="0.38" stop-color="#a855ff"/>
      <stop offset="0.72" stop-color="#ff6b8a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67b5f7"/>
      <stop offset="0.55" stop-color="#00baae"/>
      <stop offset="1" stop-color="#3dded4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe4b5"/>
      <stop offset="1" stop-color="#fdf4e1"/>
    </linearGradient>
    <!-- Retro stripes cut through the lower half of the sun -->
    <mask id="sunStripes">
      <rect width="800" height="1200" fill="#fff"/>
      <rect x="0" y="560" width="800" height="7" fill="#000"/>
      <rect x="0" y="590" width="800" height="10" fill="#000"/>
      <rect x="0" y="622" width="800" height="13" fill="#000"/>
    </mask>
  </defs>

  <!-- Gentle, slow motion; loops have different lengths so nothing moves in lockstep.
       Everything stays still for people who prefer reduced motion. -->
  <style>
    .sway, .fronds, .fronds-small, .umbrella, .drift, .drift-slow, .birds, .waves, .foam, .shimmer rect {
      transform-box: view-box;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .sway { transform-origin: 168px 1200px; animation-name: sway; animation-duration: 7s; }
    .fronds { transform-origin: 271px 610px; animation-name: fronds; animation-duration: 4.6s; }
    .sway-small { transform-origin: 798px 1200px; animation: sway 8.5s ease-in-out -2s infinite alternate; transform-box: view-box; }
    .fronds-small { transform-origin: 748px 905px; animation-name: fronds; animation-duration: 3.9s; animation-delay: -1.3s; }
    .umbrella { transform-origin: 562px 1080px; animation-name: umbrella; animation-duration: 5.2s; }
    .drift { animation-name: drift; animation-duration: 18s; }
    .drift-slow { animation-name: drift; animation-duration: 26s; animation-delay: -9s; }
    .birds { animation-name: glide; animation-duration: 11s; }
    .waves { animation-name: waves; animation-duration: 6s; }
    .foam { animation-name: foam; animation-duration: 5s; }
    .shimmer rect { transform-box: fill-box; transform-origin: center; animation-name: shimmer; animation-duration: 3.2s; }
    .shimmer rect:nth-child(2) { animation-delay: -0.8s; }
    .shimmer rect:nth-child(3) { animation-delay: -1.6s; }
    .shimmer rect:nth-child(4) { animation-delay: -2.2s; }
    .shimmer rect:nth-child(5) { animation-delay: -2.8s; }

    @keyframes sway { from { transform: rotate(-0.7deg); } to { transform: rotate(0.9deg); } }
    @keyframes fronds { from { transform: rotate(-2.2deg); } to { transform: rotate(2.6deg); } }
    @keyframes umbrella { from { transform: rotate(-1deg); } to { transform: rotate(1.2deg); } }
    @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(26px); } }
    @keyframes glide { 0% { transform: translate(-14px, 4px); } 50% { transform: translate(6px, -6px); } 100% { transform: translate(22px, 2px); } }
    @keyframes waves { from { transform: translateX(-12px); opacity: 0.25; } to { transform: translateX(12px); opacity: 0.45; } }
    @keyframes foam { from { transform: translate(-8px, 3px); } to { transform: translate(8px, -3px); } }
    @keyframes shimmer { from { transform: scaleX(0.82); opacity: 0.55; } to { transform: scaleX(1.08); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Sky -->
  <rect width="800" height="660" fill="url(#sky)"/>

  <!-- Soft clouds -->
  <g fill="#fff" opacity="0.18">
    <g class="drift">
      <rect x="70" y="250" width="260" height="22" rx="11"/>
      <rect x="140" y="282" width="190" height="16" rx="8"/>
      <rect x="430" y="400" width="200" height="16" rx="8"/>
    </g>
    <g class="drift-slow">
      <rect x="500" y="170" width="230" height="20" rx="10"/>
      <rect x="560" y="198" width="140" height="14" rx="7"/>
    </g>
  </g>

  <!-- Birds -->
  <g class="birds" fill="none" stroke="#2c188c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M520 300 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M590 340 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M470 345 q8 -8 16 0 q8 -8 16 0"/>
  </g>

  <!-- Sun, setting into the sea -->
  <circle cx="420" cy="590" r="150" fill="url(#sun)" mask="url(#sunStripes)"/>

  <!-- Sea -->
  <rect y="650" width="800" height="300" fill="url(#sea)"/>
  <!-- Sun's reflection -->
  <g class="shimmer" fill="#ffcb81" opacity="0.75">
    <rect x="330" y="668" width="180" height="9" rx="4.5"/>
    <rect x="355" y="692" width="130" height="8" rx="4"/>
    <rect x="380" y="716" width="80" height="7" rx="3.5"/>
    <rect x="395" y="740" width="50" height="6" rx="3"/>
    <rect x="405" y="762" width="30" height="5" rx="2.5"/>
  </g>
  <!-- Wave lines -->
  <g class="waves" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" opacity="0.35">
    <path d="M80 800 q20 -12 40 0 t40 0"/>
    <path d="M600 780 q20 -12 40 0 t40 0"/>
    <path d="M250 850 q20 -12 40 0 t40 0 t40 0"/>
    <path d="M560 880 q20 -12 40 0 t40 0"/>
  </g>

  <!-- Shoreline foam and sand -->
  <path class="foam" d="M-20 925 C120 895 220 950 340 925 S560 890 680 920 S780 935 820 925 V1200 H-20 Z" fill="#fff" opacity="0.85"/>
  <path d="M0 945 C130 915 230 968 350 945 S570 910 690 940 S785 955 800 945 V1200 H0 Z" fill="url(#sand)"/>

  <!-- Beach umbrella and towel -->
  <g class="umbrella">
    <path d="M560 1080 L575 960" stroke="#4c3515" stroke-width="6" stroke-linecap="round"/>
    <path d="M480 985 Q575 900 670 985 Z" fill="#ff6b8a"/>
    <path d="M575 943 Q555 960 548 985 L602 985 Q595 960 575 943 Z" fill="#ffb347"/>
  </g>
  <rect x="470" y="1095" width="170" height="44" rx="8" fill="#00d4c6" transform="rotate(-6 555 1117)"/>
  <rect x="470" y="1108" width="170" height="10" fill="#fff" opacity="0.8" transform="rotate(-6 555 1117)"/>

  <!-- Big palm, left -->
  <g class="sway" fill="#2c188c">
    <path d="M150 1200 C160 1050 175 900 215 760 C232 700 245 650 262 600 L280 606 C262 660 250 710 236 768 C200 910 190 1055 186 1200 Z"/>
    <g class="fronds">
    <path d="M270 600 C210 540 120 540 40 600 C120 570 200 580 270 615 Z"/>
    <path d="M270 600 C230 520 160 470 70 470 C150 500 215 545 262 612 Z"/>
    <path d="M270 600 C275 510 320 450 400 425 C340 470 300 530 282 610 Z"/>
    <path d="M270 600 C340 550 430 550 500 600 C430 580 350 585 280 615 Z"/>
    <path d="M270 600 C330 620 380 680 395 760 C365 700 320 650 268 618 Z"/>
    <path d="M270 600 C215 625 165 690 150 770 C185 705 225 655 278 616 Z"/>
    <path d="M270 600 C250 520 250 450 285 390 C275 460 280 530 284 605 Z"/>
    <circle cx="262" cy="618" r="11"/><circle cx="282" cy="622" r="10"/><circle cx="272" cy="634" r="10"/>
    </g>
  </g>

  <!-- Small palm, right edge -->
  <g class="sway-small" fill="#2c188c" opacity="0.9">
    <path d="M790 1200 C785 1100 768 1000 742 905 L756 900 C784 995 802 1100 808 1200 Z"/>
    <g class="fronds-small">
    <path d="M748 900 C710 860 650 862 600 900 C650 882 705 888 746 912 Z"/>
    <path d="M748 900 C730 845 690 815 640 812 C690 830 725 865 742 910 Z"/>
    <path d="M748 900 C760 845 795 815 840 805 C800 830 772 865 756 910 Z"/>
    <path d="M748 900 C790 905 820 940 830 990 C805 950 780 925 750 912 Z"/>
    <path d="M748 900 C715 915 690 950 680 995 C700 955 725 930 754 912 Z"/>
    </g>
  </g>
</svg>
